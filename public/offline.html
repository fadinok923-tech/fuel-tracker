<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <title>Tanoor Fleet — Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px system-ui, sans-serif; }
      main { max-width: 28rem; margin: 1rem; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; text-align: center; box-shadow: 0 12px 32px #0f172a12; }
      h1 { margin: 0 0 .5rem; font-size: 1.4rem; } p { color: #475569; line-height: 1.6; }
      button { margin-top: .5rem; border: 0; border-radius: .6rem; padding: .75rem 1rem; background: #059669; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Tanoor Fleet needs a connection to load vehicle and driver records. Reconnect to continue; saved records remain protected behind sign-in.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
